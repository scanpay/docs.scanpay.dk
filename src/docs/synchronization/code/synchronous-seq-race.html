    <b>end while</b>
    <i>data</i> := <span class="hljs-built_in">JSONDecode</span>(GET <span class="hljs-string">"https://api.scanpay.dk/v2/<a href="/#uris" class="hljs-attr">shopid</a>:seq:"</span> ‖ <i>localSeq</i>)

        <span class="hljs-built_in">Update</span>(<i>change</i>)
    <b>end for</b>
    <i>localSeq</i> := <i>data.seq</i>
<b>end loop</b>
