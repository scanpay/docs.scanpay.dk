<b>global</b> <i>LastSeqFromPing</i> := 0

<b>function</b> <span class="hljs-built_in">WaitForSeq</span>(<i>localSeq</i>)
    <span class="hljs-built_in">Lock</span>()
    <b>while</b> <i>LastSeqFromPing</i> ≤ <i>localSeq</i> <b>do</b>
        <span class="hljs-built_in">ConditionWait</span>()
    <b>end while</b>
    <span class="hljs-built_in">Unlock</span>()
<b>end function</b>

<b>function</b> <span class="hljs-built_in">UpdatePing</span>(<i>ping</i>)
    <span class="hljs-built_in">Lock</span>()
    <b>if</b> <i>LastSeqFromPing</i> &lt; <i>ping.seq</i> <b>then</b>
        <i>LastSeqFromPing</i> := <i>ping.seq</i>
        <span class="hljs-built_in">ConditionSignal</span>()
    <b>end if</b>
    <span class="hljs-built_in">Unlock</span>()
<b>end function</b>
