<div class="modal-dialog" role="document">
  <div class="modal-header">
    <form class="search">
      <label class="search-ico" for="search-input">
        {% include "tpl/svg/search.svg" %}
      </label>
      <input id="search-input" placeholder="Search the docs" type="search" autocomplete="off">
    </form>
  </div>
  <div class="modal-content">
    <div class="modal-body">
      <ul id="search-results"></ul>
    </div>
  </div>
</div>
