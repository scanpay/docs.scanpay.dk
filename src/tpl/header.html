<!DOCTYPE HTML><html lang="en">
<head>
  <link href="/css/docs.css?{{ csst }}" rel="stylesheet">
  <script defer src="/js/docs.js?{{ jst }}"></script>
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="https://docs.scanpay.dev{{ url }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": {{ BreadcrumbList }}
    }
  </script>
</head>

<div class="menu">
  <nav class="nav">
    <div class="nav--logo">
      <a href="/" title="Scanpay documentation">
        <img class="nav--logo--svg" src="/img/logo.svg" alt="Scanpay logo">
      </a>
    </div>

    <div class="nav--search">
      <div id="nav--burger">
        {% include "tpl/svg/burger.svg" %}
      </div>
      <form class="nav--search--form" action="/search">
        <input class="nav--search--input"
          type="search"
          name="q"
          autocomplete="off"
          placeholder="Search the docs">
      </form>
    </div>
    <ul id="nav--ul">
      {{ sidebar }}
    </ul>
  </nav>
</div>

<div class="c">
  <div id="bg">
    <header class="header--">
      <a rel="nofollow" href="https://github.com/scanpay/docs.scanpay.dk/blob/main/html/{{ path }}" class="header--git">
        {% include "tpl/svg/github.svg" %} Edit
      </a>
      <nav class="header--nav" aria-label="Breadcrumb">
        {% include "tpl/svg/breadcrumb.svg" %} {{ breadcrumbParent }} <span class="header--nav--raquo">»</span> <span aria-current="page">{{ link }}</span>
      </nav>
    </header>
    <article class="article">
